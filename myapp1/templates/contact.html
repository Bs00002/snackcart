{% extends 'base.html' %}
{% block main %}
{% include 'messages.html' %}
<section class="sb-banner sb-banner-xs sb-banner-color">
  <div class="container"><div class="sb-main-title-frame"><div class="sb-main-title">
    <h1 class="sb-h2">Contact Us</h1>
    <ul class="sb-breadcrumbs"><li><a href="/">Home</a></li><li><a href="#">Contact</a></li></ul>
  </div></div></div>
</section>
<section style="padding:70px 0;">
  <div class="container">
    <div class="row">
      <div class="col-lg-4 mb-4">
        <div style="background:#fff;border-radius:20px;padding:30px;box-shadow:0 4px 20px rgba(0,0,0,0.06);">
          <h5 style="font-weight:700;margin-bottom:20px;">Get in Touch</h5>
          <div style="display:flex;gap:15px;align-items:flex-start;margin-bottom:20px;">
            <div style="width:45px;height:45px;background:#fff7ef;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <i class="fas fa-envelope" style="color:#F5C332;font-size:18px;"></i>
            </div>
            <div><p style="font-weight:600;margin:0;font-size:14px;">Email</p><p style="color:#888;font-size:13px;margin:0;">snackcart@gmail.com</p></div>
          </div>
          <div style="display:flex;gap:15px;align-items:flex-start;margin-bottom:20px;">
            <div style="width:45px;height:45px;background:#fff7ef;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <i class="fas fa-phone" style="color:#F5C332;font-size:18px;"></i>
            </div>
            <div><p style="font-weight:600;margin:0;font-size:14px;">Phone</p><p style="color:#888;font-size:13px;margin:0;">+91 98765 43210</p></div>
          </div>
          <div style="display:flex;gap:15px;align-items:flex-start;">
            <div style="width:45px;height:45px;background:#fff7ef;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <i class="fas fa-clock" style="color:#F5C332;font-size:18px;"></i>
            </div>
            <div><p style="font-weight:600;margin:0;font-size:14px;">Working Hours</p><p style="color:#888;font-size:13px;margin:0;">Mon-Sat: 9:00 AM - 9:00 PM</p></div>
          </div>
        </div>
      </div>
      <div class="col-lg-8 mb-4">
        <div style="background:#fff;border-radius:20px;padding:35px;box-shadow:0 4px 20px rgba(0,0,0,0.06);">
          <h5 style="font-weight:700;margin-bottom:25px;">Send a Message</h5>
          <form method="POST" action="/contact">
            {% csrf_token %}
            <div class="row">
              <div class="col-md-6 mb-3">
                <label style="font-weight:600;font-size:14px;display:block;margin-bottom:6px;">Your Name</label>
                <input type="text" name="name" style="width:100%;padding:12px;border:2px solid #eee;border-radius:10px;font-size:14px;" required>
              </div>
              <div class="col-md-6 mb-3">
                <label style="font-weight:600;font-size:14px;display:block;margin-bottom:6px;">Email Address</label>
                <input type="email" name="email" style="width:100%;padding:12px;border:2px solid #eee;border-radius:10px;font-size:14px;" required>
              </div>
              <div class="col-12 mb-3">
                <label style="font-weight:600;font-size:14px;display:block;margin-bottom:6px;">Subject</label>
                <input type="text" name="subject" style="width:100%;padding:12px;border:2px solid #eee;border-radius:10px;font-size:14px;" required>
              </div>
              <div class="col-12 mb-4">
                <label style="font-weight:600;font-size:14px;display:block;margin-bottom:6px;">Message</label>
                <textarea name="message" rows="5" style="width:100%;padding:12px;border:2px solid #eee;border-radius:10px;font-size:14px;resize:vertical;" required></textarea>
              </div>
              <div class="col-12">
                <button type="submit" style="background:#F5C332;color:#fff;border:none;padding:13px 35px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;">Send Message</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
