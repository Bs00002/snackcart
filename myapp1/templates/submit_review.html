{% extends 'base.html' %}
{% block main %}
{% include 'messages.html' %}
<section class="sb-banner sb-banner-xs sb-banner-color"><div class="container"><div class="sb-main-title-frame"><div class="sb-main-title"><h1 class="sb-h2">Rate Your Order</h1></div></div></div></section>
<section style="padding:60px 0;">
  <div class="container">
    <div style="max-width:550px;margin:auto;background:#fff;border-radius:20px;padding:35px;box-shadow:0 8px 30px rgba(0,0,0,0.08);">
      <h4 style="font-weight:700;margin-bottom:8px;">How was your experience?</h4>
      <p style="color:#888;margin-bottom:25px;">Order #{{ order.id }} - {{ order.product.product_name }}</p>
      <form method="POST" action="/customer/review/{{ order.id }}">
        {% csrf_token %}
        <div style="margin-bottom:20px;">
          <label style="font-size:14px;font-weight:600;display:block;margin-bottom:10px;">Rating</label>
          <div style="display:flex;gap:10px;">
            {% for i in "12345" %}
            <label style="cursor:pointer;font-size:30px;color:#ddd;" id="star{{ forloop.counter }}">
              <input type="radio" name="rating" value="{{ forloop.counter }}" style="display:none;" onchange="updateStars({{ forloop.counter }})">★
            </label>
            {% endfor %}
          </div>
        </div>
        <div style="margin-bottom:20px;">
          <label style="font-size:14px;font-weight:600;display:block;margin-bottom:8px;">Your Review</label>
          <textarea name="comment" rows="4" style="width:100%;padding:12px;border:2px solid #eee;border-radius:10px;font-size:14px;" placeholder="Share your experience..." required></textarea>
        </div>
        <button type="submit" style="width:100%;height:50px;background:#F5C332;border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:700;cursor:pointer;">Submit Review</button>
      </form>
    </div>
  </div>
</section>
<script>
function updateStars(rating) {
  for(var i=1; i<=5; i++) {
    document.getElementById('star'+i).style.color = i <= rating ? '#F5C332' : '#ddd';
  }
}
</script>
{% endblock %}
