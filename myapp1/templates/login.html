{% extends 'base.html' %}
{% block main %}
{% include 'messages.html' %}
<style>
.login-register_area { padding: 80px 0; }
.auth-card {
  background: #fff;
  padding: 40px;
  border-radius: 20px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.12);
  max-width: 480px;
  margin: auto;
}
.auth-card label { font-size:14px; font-weight:600; color:#555; margin-bottom:6px; display:block; }
.auth-card input {
  width:100%; padding:12px 16px; border:2px solid #eee;
  border-radius:10px; font-size:14px; margin-bottom:16px; transition:0.3s;
}
.auth-card input:focus { border-color:#F5C332; outline:none; }
.auth-btn {
  width:100%; height:50px; background:#F5C332; border:none;
  border-radius:12px; color:#fff; font-size:16px; font-weight:700;
  cursor:pointer; transition:0.3s;
}
.auth-btn:hover { background:#e0b020; transform:translateY(-2px); }
</style>

<section class="sb-banner sb-banner-xs sb-banner-color">
  <div class="container">
    <div class="row">
      <div class="col-lg-12">
        <div class="sb-main-title-frame">
          <div class="sb-main-title">
            <h1 class="sb-h2">Login</h1>
            <ul class="sb-breadcrumbs">
              <li><a href="/">Home</a></li>
              <li><a href="#">Login</a></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<div class="login-register_area">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-7">
        <div class="auth-card">
          <h4 style="font-weight:700;margin-bottom:25px;color:#333;">Welcome Back 👋</h4>
          <form method="POST" action="/login">
            {% csrf_token %}
            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Enter your password" required>

            <div style="text-align:right;margin-bottom:20px;">
              <a href="/forgot-password" style="font-size:13px;color:#F5C332;">Forgot Password?</a>
            </div>

            <button type="submit" class="auth-btn">Login</button>
          </form>
          <div style="text-align:center;margin-top:20px;">
            <p style="font-size:14px;color:#888;">Don't have an account? <a href="/register" style="color:#F5C332;font-weight:600;">Sign Up</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<br><br>
{% endblock %}
