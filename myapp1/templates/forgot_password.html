{% extends 'base.html' %}
{% block main %}
{% include 'messages.html' %}
<section class="sb-banner sb-banner-xs sb-banner-color">
  <div class="container"><div class="sb-main-title-frame"><div class="sb-main-title">
    <h1 class="sb-h2">Forgot Password</h1>
    <ul class="sb-breadcrumbs"><li><a href="/">Home</a></li><li><a href="#">Forgot Password</a></li></ul>
  </div></div></div>
</section>
<section style="padding:80px 0;">
  <div class="container">
    <div style="max-width:450px;margin:auto;background:#fff;border-radius:20px;padding:35px;box-shadow:0 8px 30px rgba(0,0,0,0.1);">
      <h4 style="font-weight:700;margin-bottom:10px;">Reset Password</h4>
      <p style="color:#888;margin-bottom:25px;">Enter your registered email. We'll send a new password to your inbox.</p>
      <form method="POST" action="/forgot-password">
        {% csrf_token %}
        <label style="font-weight:600;font-size:14px;display:block;margin-bottom:6px;">Email Address</label>
        <input type="email" name="email" style="width:100%;padding:12px 16px;border:2px solid #eee;border-radius:10px;font-size:14px;margin-bottom:20px;" placeholder="Enter your email" required>
        <button type="submit" style="width:100%;height:50px;background:#F5C332;border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:700;cursor:pointer;">Send New Password</button>
      </form>
      <div style="text-align:center;margin-top:20px;">
        <a href="/login" style="color:#F5C332;font-size:14px;font-weight:600;">Back to Login</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
