{% include 'messages.html' %}
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Payment - SnackCart</title>
  <link rel="stylesheet" href="/static/css/plugins/bootstrap.min.css">
  <style>
    body { background:#f9f9f9; display:flex; align-items:center; justify-content:center; min-height:100vh; font-family:sans-serif; }
    .pay-card { background:#fff; border-radius:20px; padding:40px; max-width:480px; width:90%; box-shadow:0 10px 40px rgba(0,0,0,0.1); text-align:center; }
    .pay-icon { width:80px; height:80px; background:linear-gradient(135deg,#F5C332,#ff8c42); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 20px; }
  </style>
</head>
<body>
  <div class="pay-card">
    <div class="pay-icon"><i class="fas fa-credit-card" style="color:#fff;font-size:32px;"></i></div>
    <h3 style="font-weight:800;margin-bottom:5px;">Complete Payment</h3>
    <p style="color:#888;margin-bottom:20px;">Order #{{ order.id }}</p>
    <div style="font-size:36px;font-weight:800;color:#F5C332;margin-bottom:25px;">₹{{ total }}</div>
    <button id="rzp-button" style="width:100%;height:54px;background:#F5C332;border:none;border-radius:14px;color:#fff;font-size:18px;font-weight:700;cursor:pointer;">
      Pay Now ₹{{ total }}
    </button>
    <p style="font-size:12px;color:#aaa;margin-top:15px;">Secured by Razorpay</p>
  </div>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    var options = {
      key: "{{ razorpay_key }}",
      amount: {{ amount }},
      currency: "INR",
      name: "SnackCart",
      description: "Order #{{ order.id }}",
      order_id: "{{ razorpay_order_id }}",
      handler: function(response) {
        var form = document.createElement('form');
        form.method = 'POST';
        form.action = '/payment-success';
        var fields = {
          'csrfmiddlewaretoken': '{{ csrf_token }}',
          'razorpay_order_id': response.razorpay_order_id,
          'razorpay_payment_id': response.razorpay_payment_id,
          'razorpay_signature': response.razorpay_signature
        };
        for (var k in fields) {
          var inp = document.createElement('input');
          inp.type = 'hidden';
          inp.name = k;
          inp.value = fields[k];
          form.appendChild(inp);
        }
        document.body.appendChild(form);
        form.submit();
      },
      theme: { color: "#F5C332" }
    };
    document.getElementById('rzp-button').onclick = function() {
      var rzp = new Razorpay(options);
      rzp.open();
    };
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</body>
</html>
