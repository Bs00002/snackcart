{% extends 'base.html' %}
{% block main %}
{% include 'messages.html' %}
<section class="sb-banner sb-banner-xs sb-banner-color">
  <div class="container"><div class="sb-main-title-frame"><div class="sb-main-title">
    <h1 class="sb-h2">Add Product</h1>
    <ul class="sb-breadcrumbs"><li><a href="/seller/dashboard">Dashboard</a></li><li><a href="#">Add Product</a></li></ul>
  </div></div></div>
</section>
<section style="padding:60px 0;">
  <div class="container">
    <div style="max-width:750px;margin:auto;background:#fff;border-radius:20px;padding:40px;box-shadow:0 8px 30px rgba(0,0,0,0.08);">
      <h4 style="font-weight:700;margin-bottom:25px;">Product Details</h4>
      <form method="POST" action="/seller/add-product" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="row">
          <div class="col-md-8 mb-3"><label style="font-weight:600;font-size:14px;">Product Name *</label><input type="text" name="product_name" class="form-control" required style="border-radius:10px;border:2px solid #eee;padding:12px;"></div>
          <div class="col-md-4 mb-3"><label style="font-weight:600;font-size:14px;">Category *</label>
            <select name="category" class="form-control" required style="border-radius:10px;border:2px solid #eee;padding:12px;">
              <option value="">Select Category</option>
              {% for cat in categories %}<option value="{{ cat.id }}">{{ cat.category_name }}</option>{% endfor %}
            </select>
          </div>
          <div class="col-12 mb-3"><label style="font-weight:600;font-size:14px;">Description *</label><textarea name="description" class="form-control" rows="3" required style="border-radius:10px;border:2px solid #eee;padding:12px;"></textarea></div>
          <div class="col-12 mb-3"><label style="font-weight:600;font-size:14px;">Ingredients *</label><textarea name="ingredients" class="form-control" rows="2" required placeholder="e.g. Flour, Sugar, Butter..." style="border-radius:10px;border:2px solid #eee;padding:12px;"></textarea></div>
          <div class="col-md-4 mb-3"><label style="font-weight:600;font-size:14px;">Expiry/Shelf Life *</label><input type="text" name="expiry_time" class="form-control" placeholder="e.g. 2 days" required style="border-radius:10px;border:2px solid #eee;padding:12px;"></div>
          <div class="col-md-4 mb-3"><label style="font-weight:600;font-size:14px;">Preparation Time *</label><input type="text" name="preparation_time" class="form-control" placeholder="e.g. 1 hour 30 min" required style="border-radius:10px;border:2px solid #eee;padding:12px;"></div>
          <div class="col-md-4 mb-3"><label style="font-weight:600;font-size:14px;">Est. Delivery Time</label><input type="text" name="estimated_delivery_time" class="form-control" placeholder="e.g. 45 min" style="border-radius:10px;border:2px solid #eee;padding:12px;"></div>
          <div class="col-md-4 mb-3"><label style="font-weight:600;font-size:14px;">Quantity Unit *</label>
            <select name="quantity_unit" class="form-control" required style="border-radius:10px;border:2px solid #eee;padding:12px;">
              <option value="Per Piece">Per Piece</option>
              <option value="Per Plate">Per Plate</option>
              <option value="250g">250g</option>
              <option value="500g">500g</option>
              <option value="1 KG">1 KG</option>
              <option value="Custom">Custom</option>
            </select>
          </div>
          <div class="col-md-4 mb-3"><label style="font-weight:600;font-size:14px;">Custom Unit (if any)</label><input type="text" name="custom_unit" class="form-control" placeholder="e.g. 200ml" style="border-radius:10px;border:2px solid #eee;padding:12px;"></div>
          <div class="col-md-4 mb-3"><label style="font-weight:600;font-size:14px;">Price (₹) *</label><input type="number" name="price" class="form-control" min="1" required style="border-radius:10px;border:2px solid #eee;padding:12px;"></div>
          <div class="col-md-4 mb-3"><label style="font-weight:600;font-size:14px;">Stock Quantity *</label><input type="number" name="stock_qty" class="form-control" min="0" required style="border-radius:10px;border:2px solid #eee;padding:12px;"></div>
          <div class="col-md-4 mb-3"><label style="font-weight:600;font-size:14px;">Max Orders/Day</label><input type="number" name="max_orders_per_day" class="form-control" value="10" min="1" style="border-radius:10px;border:2px solid #eee;padding:12px;"></div>
          <div class="col-md-4 mb-3 d-flex align-items-end"><label style="cursor:pointer;"><input type="checkbox" name="is_customizable" style="margin-right:8px;"> Allow Customization</label></div>
          <div class="col-md-6 mb-3"><label style="font-weight:600;font-size:14px;">Product Photo *</label><input type="file" name="product_photo" class="form-control" accept="image/*" required style="border-radius:10px;border:2px solid #eee;padding:10px;"></div>
          <div class="col-12 mt-3"><button type="submit" style="width:100%;height:52px;background:#F5C332;border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:700;cursor:pointer;">Add Product</button></div>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
