{% extends 'base.html' %}
{% block main %}
{% include 'messages.html' %}

<section class="sb-banner sb-banner-xs sb-banner-color">
  <div class="container">
    <div class="sb-main-title-frame">
      <div class="sb-main-title">
        <h1 class="sb-h2">Change Password</h1>
        <ul class="sb-breadcrumbs">
          <li><a href="/">Home</a></li>
          <li><a href="#">Change Password</a></li>
        </ul>
      </div>
    </div>
  </div>
</section>

<section style="padding:70px 0; background:#f9f9f9;">
  <div class="container">
    <div style="max-width:500px; margin:auto; background:#fff; border-radius:20px; padding:40px; box-shadow:0 8px 30px rgba(0,0,0,0.08);">

      <div style="text-align:center;margin-bottom:30px;">
        <div style="width:65px;height:65px;background:linear-gradient(135deg,#F5C332,#ff8c42);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 15px;">
          <i class="fas fa-key" style="color:#fff;font-size:26px;"></i>
        </div>
        <h4 style="font-weight:700;color:#333;margin:0;">Update Password</h4>
        <p style="color:#888;font-size:14px;margin-top:5px;">Keep your account secure with a strong password</p>
      </div>

      <form method="POST" action="/change-password">
        {% csrf_token %}

        <div style="margin-bottom:18px;">
          <label style="font-size:14px;font-weight:600;color:#555;display:block;margin-bottom:7px;">Current Password *</label>
          <div style="position:relative;">
            <input type="password" name="old_password" id="oldPass" placeholder="Enter your current password"
              style="width:100%;padding:13px 45px 13px 15px;border:2px solid #eee;border-radius:10px;font-size:14px;outline:none;transition:0.3s;box-sizing:border-box;"
              onfocus="this.style.borderColor='#F5C332'" onblur="this.style.borderColor='#eee'" required>
            <i class="fas fa-eye" onclick="togglePass('oldPass',this)" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;color:#aaa;"></i>
          </div>
        </div>

        <div style="margin-bottom:18px;">
          <label style="font-size:14px;font-weight:600;color:#555;display:block;margin-bottom:7px;">New Password *</label>
          <div style="position:relative;">
            <input type="password" name="new_password" id="newPass" placeholder="Min 8 chars, uppercase, number & symbol"
              style="width:100%;padding:13px 45px 13px 15px;border:2px solid #eee;border-radius:10px;font-size:14px;outline:none;transition:0.3s;box-sizing:border-box;"
              onfocus="this.style.borderColor='#F5C332'" onblur="this.style.borderColor='#eee'" required>
            <i class="fas fa-eye" onclick="togglePass('newPass',this)" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;color:#aaa;"></i>
          </div>
        </div>

        <div style="margin-bottom:28px;">
          <label style="font-size:14px;font-weight:600;color:#555;display:block;margin-bottom:7px;">Confirm New Password *</label>
          <div style="position:relative;">
            <input type="password" name="confirm_password" id="confPass" placeholder="Re-enter new password"
              style="width:100%;padding:13px 45px 13px 15px;border:2px solid #eee;border-radius:10px;font-size:14px;outline:none;transition:0.3s;box-sizing:border-box;"
              onfocus="this.style.borderColor='#F5C332'" onblur="this.style.borderColor='#eee'" required>
            <i class="fas fa-eye" onclick="togglePass('confPass',this)" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;color:#aaa;"></i>
          </div>
        </div>

        <button type="submit"
          style="width:100%;height:52px;background:#F5C332;border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:700;cursor:pointer;transition:0.3s;"
          onmouseover="this.style.background='#e0b020'" onmouseout="this.style.background='#F5C332'">
          Update Password
        </button>
      </form>

      <div style="text-align:center;margin-top:20px;">
        <a href="/" style="font-size:13px;color:#F5C332;font-weight:600;"><i class="fas fa-arrow-left"></i> Back to Home</a>
      </div>
    </div>
  </div>
</section>

<script>
function togglePass(id, icon) {
  var inp = document.getElementById(id);
  if (inp.type === 'password') {
    inp.type = 'text';
    icon.classList.remove('fa-eye');
    icon.classList.add('fa-eye-slash');
  } else {
    inp.type = 'password';
    icon.classList.remove('fa-eye-slash');
    icon.classList.add('fa-eye');
  }
}
</script>
{% endblock %}
